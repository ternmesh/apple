name: Release

# A tag `v1.2.3` sends version 1.2.3 to TestFlight, for iOS and for the Mac. Sending a build on to
# review is done by hand, in App Store Connect.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight (${{ matrix.platform }})
    runs-on: macos-26
    # The App Store Connect key is this environment's, which only a `v*` tag may use.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nothing is signed for the store until the export, with a certificate Apple keeps: a
          # signed archive would have each runner make a development certificate of its own.
          # iOS's archive is unsigned: Xcode signs nothing for a device without a provisioning
          # profile. A step below gives it its one entitlement, Associated Domains.
          - platform: iOS
            signing: CODE_SIGNING_ALLOWED=NO
          # The Mac's is signed ad hoc, which is what carries the sandbox's entitlements to the
          # export.
          - platform: macOS
            signing: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      # The version is the tag's. The build number is the run's and the attempt's, as 12.1: it only
      # goes up, and a run tried again does not send a number Apple already has.
      - name: Archive
        run: >-
          xcodebuild archive -project Tern.xcodeproj -scheme Tern
          -destination 'generic/platform=${{ matrix.platform }}'
          -archivePath "$RUNNER_TEMP/Tern.xcarchive"
          MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          ${{ matrix.signing }}
      # The export signs with the entitlements it finds on the archive's app, and an unsigned one
      # has none. An ad hoc signature carries them, as it does for the Mac's.
      - name: Give the iOS archive its entitlements
        if: matrix.platform == 'iOS'
        run: >-
          codesign --force --sign - --entitlements App/Tern-iOS.entitlements
          "$RUNNER_TEMP/Tern.xcarchive/Products/Applications/Tern.app"
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign and upload
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Tern.xcarchive"
          -exportOptionsPlist .github/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
