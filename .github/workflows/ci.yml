name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The specification moves on its own: once a week, check this still conforms to it.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # TernKit uses only the standard library, so it is tested on Linux, which is quick, and on a
  # Mac, which is what it ships on.
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # The app: Core Bluetooth and SwiftUI build only here. Unsigned, for the iOS simulator and the Mac.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Build for iOS
        run: >-
          xcodebuild -project Tern.xcodeproj -scheme Tern
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for macOS
        run: >-
          xcodebuild -project Tern.xcodeproj -scheme Tern
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  # The tests above read this repository's copy of the vectors. This runs them against the
  # specification's own, as it is on main today: it fails if the app no longer conforms, and says
  # so if the copy is out of date.
  specification:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/spec
          path: spec
          sparse-checkout: vectors
      - name: Use the specification's vectors
        run: |
          if ! cmp -s spec/vectors/companion.json Tests/TernKitTests/vectors/companion.json; then
            echo "::warning::Tests/TernKitTests/vectors/companion.json differs from the specification's. Copy the new file in the pull request that changes the code to match."
          fi
          cp spec/vectors/companion.json Tests/TernKitTests/vectors/companion.json
          if ! cmp -s spec/vectors/sharing.json Tests/TernKitTests/vectors/sharing.json; then
            echo "::warning::Tests/TernKitTests/vectors/sharing.json differs from the specification's. Copy the new file in the pull request that changes the code to match."
          fi
          cp spec/vectors/sharing.json Tests/TernKitTests/vectors/sharing.json
          if ! cmp -s spec/vectors/groups.json Tests/TernKitTests/vectors/groups.json; then
            echo "::warning::Tests/TernKitTests/vectors/groups.json differs from the specification's. Copy the new file in the pull request that changes the code to match."
          fi
          cp spec/vectors/groups.json Tests/TernKitTests/vectors/groups.json
      - run: swift test
